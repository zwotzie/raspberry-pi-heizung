[heizung]
blnet_host = "hostname (fqdn) from blnet web interface"

# Operating mode is set here and applied on daemon restart (supervisorctl/systemd restart heizung).
operating_mode="pellets" # [pellets, firewood]


# Optional push mode: when push_url is set, the daemon PUSHES the sensor data
# to this TSDB (VictoriaMetrics import API) after every poll and does NOT
# start the scrape HTTP server (:9100) anymore.
# Leave push_url unset/empty to keep scrape mode.
push_url="http://victoriametrics.lan:8428"
push_job="heizung"
push_instance="heizung"

# Port the daemon exposes its Prometheus metrics on (scrape mode, default).
metrics_port=9100

# Internal URL of the TSDB instance, used by the API to query chart data.
# In push mode this should be the same VictoriaMetrics instance as push_url.
# prometheus_url="http://prometheus.lan:9090"
