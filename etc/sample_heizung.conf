[heizung]
url="insert real url"
url_internal="raspberry uvr1611 url"
blnet_host = "hostname (fqdn) from blnet web interface"
logger=True

# Fallback if the API is unreachable; active mode is stored in the database.
operating_mode="pellets" # [pellets, firewood]

# FastAPI base URL – daemon POSTs measurements here, and reads operating_mode from here
measurements_url="http://api-host:8000"

# PostgreSQL DSN – used by the API server to read/write measurements and settings
db_url="postgresql://heizung:secret@db-host:5432/heizung"

