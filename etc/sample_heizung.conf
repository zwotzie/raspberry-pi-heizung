[heizung]
blnet_host = "hostname (fqdn) from blnet web interface"
logger=True

# Operating mode is set here and applied on daemon restart (supervisorctl/systemd restart heizung).
operating_mode="pellets" # [pellets, firewood]

# Port the daemon exposes its Prometheus metrics on (scraped by Prometheus).
metrics_port=9100

# Internal URL of the Prometheus instance, used by the API to query chart data.
prometheus_url="http://prometheus.internal:9090"
