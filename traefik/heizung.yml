http:

  middlewares:
    lan-only:
      ipAllowList:
        sourceRange:
          - "192.168.1.0/24"

  routers:
    # PUT /settings/operating-mode – LAN only
    heizung-private:
      rule: "Host(`heizung.domain.de`) && Method(`PUT`) && PathPrefix(`/settings`)"
      entryPoints:
        - web
      middlewares:
        - lan-only
      service: heizung-api
      priority: 20

    # Everything else – public
    heizung-public:
      rule: "Host(`heizung.domain.de`)"
      entryPoints:
        - web
      service: heizung-api
      priority: 10

  services:
    heizung-api:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8000"   # uvicorn runs natively via supervisor

