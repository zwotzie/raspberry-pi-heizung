[program:uvr-api]
command=/home/pi/raspberry-pi-heizung/venv/bin/uvicorn heizung.api:app --host 0.0.0.0 --port 8000
process_name=%(program_name)s
numprocs=1
directory=/home/pi/raspberry-pi-heizung
autostart=true
autorestart=unexpected
user=pi
; All configuration is read from etc/heizung.conf in the project directory.
; Set HEIZUNG_CONFIG_PATH if the working directory is different.
environment=HEIZUNG_CONFIG_PATH="/home/pi/raspberry-pi-heizung"
redirect_stderr=true
stdout_logfile=/home/pi/raspberry-pi-heizung/logs/supervisor_uvr_api.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=10
