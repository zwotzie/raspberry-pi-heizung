<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Heizung UVR1611</title>
    <style>
        body  { background-color: #000; color: #dfdfdf; font-family: sans-serif; margin: 0 16px; }
        a     { color: #aaa; }
        a.active { color: #fff; font-weight: bold; text-decoration: none; }
        #toolbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
        input[type=date] { background: #111; color: #dfdfdf; border: 1px solid #444; padding: 4px 8px; }

        /* settings button */
        #settings-btn { background: none; border: 1px solid #444; color: #aaa; padding: 4px 10px;
                        cursor: pointer; border-radius: 4px; margin-left: 12px; }
        #settings-btn:hover { border-color: #aaa; color: #fff; }

        /* modal */
        #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
                         z-index: 100; align-items: center; justify-content: center; }
        #modal-overlay.open { display: flex; }
        #modal { background: #1a1a1a; border: 1px solid #444; border-radius: 8px;
                 padding: 24px; min-width: 320px; }
        #modal h2 { margin: 0 0 16px; font-size: 1rem; color: #ccc; }
        #modal label { display: block; margin: 10px 0 4px; font-size: .85rem; color: #999; }
        #modal input[type=password], #modal select {
            width: 100%; box-sizing: border-box;
            background: #111; color: #dfdfdf; border: 1px solid #444; padding: 6px 8px; }
        #modal .row { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
        #modal button { padding: 6px 16px; cursor: pointer; border-radius: 4px; border: none; }
        #modal-save   { background: #2a6; color: #fff; }
        #modal-cancel { background: #333; color: #ccc; }
        #modal-msg    { margin-top: 10px; font-size: .85rem; min-height: 1.2em; }
        .ok  { color: #4d4; }
        .err { color: #d44; }
    </style>
</head>
<body>
<div id="toolbar">
    <h1 style="margin:0">Heizungskurvenverlauf</h1>
    <div>
        <input type="date" id="datepicker">
        &nbsp;
        <a id="link-day"  href="?period=day">Tagesansicht</a>
        &nbsp;|&nbsp;
        <a id="link-week" href="?period=week">Wochenansicht</a>
        <button id="settings-btn" title="Betriebsmodus umschalten">⚙</button>
    </div>
</div>

<!-- settings modal -->
<div id="modal-overlay">
    <div id="modal">
        <h2>Betriebsmodus</h2>
        <label>Aktueller Modus</label>
        <select id="mode-select">
            <option value="pellets">Pellets</option>
            <option value="firewood">Holzvergaser</option>
        </select>
        <p id="modal-msg"></p>
        <div class="row">
            <button id="modal-cancel">Abbrechen</button>
            <button id="modal-save">Speichern</button>
        </div>
    </div>
</div>

<div id="Pufferspeicher" style="height:500px"></div>
<div id="Solar"          style="height:500px"></div>
<div id="Heizung"        style="height:500px"></div>
<div id="Wärmeerzeuger"  style="height:500px"></div>
<script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
<script src="uvr-charts.js"></script>
</body>
</html>
